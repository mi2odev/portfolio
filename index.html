<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Mehdi Zitouni — Portfolio</title>
    <meta
      name="description"
      content="Full-Stack Developer · Data Science & AI — Mohamed Mehdi Zitouni. Eight design directions, one portfolio."
    />
    <link rel="canonical" href="https://mohamedmehdi-zitouni.netlify.app/" />
    <meta name="theme-color" content="#0B0D11" />

    <!-- Link previews (LinkedIn, Facebook, Slack, WhatsApp, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamed Mehdi Zitouni" />
    <meta property="og:title" content="Mohamed Mehdi Zitouni — Full-Stack Developer · Data Science & AI" />
    <meta
      property="og:description"
      content="Full-stack web developer, freelancing since 2023, with hands-on ML and Big Data experience. MSc in Data Science & Intelligent Systems."
    />
    <meta property="og:url" content="https://mohamedmehdi-zitouni.netlify.app/" />
    <meta property="og:image" content="https://mohamedmehdi-zitouni.netlify.app/photo.jpg" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Portrait of Mohamed Mehdi Zitouni" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mohamed Mehdi Zitouni — Full-Stack Developer · Data Science & AI" />
    <meta
      name="twitter:description"
      content="Full-stack web developer, freelancing since 2023, with hands-on ML and Big Data experience. MSc in Data Science & Intelligent Systems."
    />
    <meta name="twitter:image" content="https://mohamedmehdi-zitouni.netlify.app/photo.jpg" />

    <!-- The portrait is the largest thing above the fold in every design -->
    <link rel="preload" as="image" href="/photo.webp" type="image/webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohamed Mehdi Zitouni",
        "jobTitle": "Full-Stack Developer · Data Science & AI",
        "url": "https://mohamedmehdi-zitouni.netlify.app/",
        "image": "https://mohamedmehdi-zitouni.netlify.app/photo.jpg",
        "address": { "@type": "PostalAddress", "addressLocality": "Constantine", "addressCountry": "DZ" },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "University of Constantine 2 (Abdelhamid Mehri)" },
          { "@type": "CollegeOrUniversity", "name": "University Larbi Ben M'Hidi (Oum El Bouaghi)" }
        ],
        "sameAs": ["https://github.com/mi2odev", "https://www.instagram.com/_.mi2o/"]
      }
    </script>

    <!-- All fonts used across the seven versions, in one request -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Orbitron:wght@700;800&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
