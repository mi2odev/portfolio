<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Mehdi Zitouni — Portfolio</title>
    <meta
      name="description"
      content="Full Stack Developer · Data Science & AI — Mohamed Mehdi Zitouni. Eight design directions, one portfolio."
    />

    <meta name="theme-color" content="#05050b" />

    <!-- Open Graph / social link previews (SITE_URL is resolved at build time, see vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamed Mehdi Zitouni" />
    <meta property="og:title" content="Mohamed Mehdi Zitouni — Front-end Developer" />
    <meta
      property="og:description"
      content="Front-end Developer · React, TypeScript, Tailwind. Building ideas for a better tomorrow."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohamed Mehdi Zitouni — Front-end Developer portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Mehdi Zitouni — Front-end Developer" />
    <meta
      name="twitter:description"
      content="Front-end Developer · React, TypeScript, Tailwind. Building ideas for a better tomorrow."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Mohamed Mehdi Zitouni — Front-end Developer portfolio" />
    <!-- All fonts used across the eight versions, in one request -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
