    <!--
      Loaded without blocking the first paint: the preload starts the download
      immediately while `media="print"` keeps the stylesheet off the critical
      path, and src/main.tsx promotes it to `media="all"` on boot. The promotion
      lives in a module rather than an inline onload handler so the site stays
      compatible with a strict `script-src 'self'` policy (see netlify.toml).
      `display=swap` is already in the URL, so text paints in a fallback face
      either way — this only removes the blocking round trip.
    -->
