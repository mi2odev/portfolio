# Netlify build + delivery settings.
# The build command type-checks first, so a type error fails the deploy
# instead of shipping a broken bundle.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    # Strict enough that no third-party script can run: the only inline script is
    # the JSON-LD block, which browsers parse as data rather than execute, and the
    # font stylesheet is promoted from src/main.tsx instead of an inline onload.
    # `style-src 'unsafe-inline'` is unavoidable — the designs are inline styles.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

# Hashed build output never changes under the same name — cache it hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets in public/ keep stable names, so revalidate daily.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Single-page app: everything resolves to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
